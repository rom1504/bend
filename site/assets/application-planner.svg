<g fill="none" stroke="#7e9986" stroke-width="2" marker-end="url(#arrow)">
<path d="M148 170 C193 170 197 99 246 99"/><path d="M148 170 C192 170 197 220 246 220"/><path d="M148 170 C191 170 200 329 246 329"/><path d="M148 329 L246 329"/>
<path d="M365 99 C411 99 414 135 465 135"/><path d="M365 99 C416 99 408 270 465 270"/><path d="M365 220 C414 220 415 270 465 270"/><path d="M365 329 C416 329 411 135 465 135"/>
</g>
