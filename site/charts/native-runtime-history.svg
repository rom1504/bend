    <dc:title>Native Runtime History</dc:title>
    <dc:date>2026-10-17</dc:date>
    <dc:description>Native generated-program runtime divided by upstream C runtime. Changed benchmark suites are disconnected. Hollow points and dashed segments identify earlier results carried by byte-identical output, not fresh runtime measurements. The final broad mean gives equal weight to 44 positive-work points and is 1.043461x. Lower is better; the axis starts at 0.9x.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
