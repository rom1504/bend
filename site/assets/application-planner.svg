<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">A dependency plan with shared prerequisites</title>
<desc id="desc">The checked shared.graph fixture. Arrows go from prerequisite to consumer. Core serves lib, ui and harness; assets serves ui; lib and ui serve app; lib and harness serve tests. The plan includes every reachable node once.</desc>
