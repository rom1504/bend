  <g id="text_11">
   <text style="fill: #202d29; font: 700 18px 'DejaVu Sans'; text-anchor: start" x="58.32" y="36.256387" transform="rotate(-0 58.32 36.256387)">Conformance · four independent scopes</text>
  </g>
  <g id="text_12">
   <text style="fill: #202d29; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="58.32" y="70.737891" transform="rotate(-0 58.32 70.737891)">01   FRONTEND · exact parse / check agreement</text>
  </g>
  <g id="text_13">
   <text style="fill: #586660; font: 11.5px 'DejaVu Sans'; text-anchor: start" x="58.32" y="96.635803" transform="rotate(-0 58.32 96.635803)">P91 · 3,173 of 3,174 exact · axis starts at 70%</text>
  </g>
  <g id="text_14">
   <text style="fill: #586660; font: 10.5px 'DejaVu Sans'" transform="translate(77.76 265.219959)">Disconnected targets have different denominators. Latest remaining difference:</text>
   <text style="fill: #586660; font: 10.5px 'DejaVu Sans'" transform="translate(77.76 280.169006)">B2 rejects the invalid proof, but its deep diagnostic is shortened after a stack overflow.</text>
  </g>
  <g id="text_15">
   <text style="fill: #202d29; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="58.32" y="328.785891" transform="rotate(-0 58.32 328.785891)">02   NATIVE · P102 candidate04, B1 and B2</text>
  </g>
  <g id="text_16">
   <text style="fill: #245f43; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="77.76" y="378.557381" transform="rotate(-0 77.76 378.557381)">69 / 69</text>
  </g>
