    <dc:title>Simplicity</dc:title>
    <dc:date>2026-10-04</dc:date>
    <dc:description>Physical and nonblank compiler source lines across 14 selected snapshots, on a zero-based axis. Dedicated consolidation removes 1842 physical lines from Phase5 to Phase7. Later coverage and performance work increases source size to 23007 physical lines. Missing nonblank counts are left unplotted. Source size is a proxy, not a complete measure of simplicity.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
