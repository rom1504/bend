 <title>Native Compilation Upstream</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Native Compilation Upstream</dc:title>
    <dc:date>2026-10-17</dc:date>
    <dc:description>Phase105 native B1 compilation compared with pinned upstream TypeScript on Bun. Broad prepared-Base ratio is 0.499396x and live-Base ratio is 2.383954x, each a geometric mean giving equal weight to 23 original source programs derived from 45 points, with two observations per role and point. Prepared native reuses authenticated Base while upstream checks source Base in both modes. Full compiler-source prepared ratio is 2.602091x, a separate workload using two observations per role, not included in either broad aggregate. All values use complete compiler child-process wall time, including startup, preparation, C output and exit; Clang and public CLI launch and authentication are excluded. The 1x reference is upstream and lower is better.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
