 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Runtime Programs</dc:title>
    <dc:date>2026-10-08</dc:date>
    <dc:description>Phase66 execution times divided by same-window TypeScript reference times for 23 program groups. Lower is better. The logarithmic axis has a visible 1x equal-time reference. P66 · geometric mean within each source program. Parentheses show case counts. The headline weights all 45 cases equally, rather than these 23 groups.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
