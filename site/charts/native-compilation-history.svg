   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Native Compilation History</dc:title>
    <dc:date>2026-10-17</dc:date>
    <dc:description>Native B1 compilation history shown as separate matched before-and-after comparisons. Circles show compiler-request ratios; diamonds show complete-process ratios. Baselines and cohorts differ between screens, so no trend line joins them and gains are not multiplied. These historical baselines are compiler versions, not upstream TypeScript. Lower is better; vertical axis starts at 0.5x.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
