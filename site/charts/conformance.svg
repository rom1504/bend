    <dc:title>Conformance</dc:title>
    <dc:date>2026-10-06</dc:date>
    <dc:description>Exact parse/check agreement across selected recorded milestones. Three disconnected series use distinct pinned upstream targets and denominators. Vertical axis starts at 70 percent. Fresh frontend evidence ends at Phase45, with 3026 of 3026 observations. A separate lower panel shows independent source semantics on the unchanged 96 scenarios: Phase52 passes 95 and Phase53 passes 96. TypeScript remains at 95. These distinct suites measure different scopes and must not be combined into one percentage.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
