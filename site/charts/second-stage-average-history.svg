   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Second Stage Average History</dc:title>
    <dc:date>2026-10-06</dc:date>
    <dc:description>Four separate B2 first-request observations with import and API load included. P56 original, P57 repeat and P58 fresh baseline all use the P56 B2 compiler. The final same-campaign pair improves from 5.3201x to 2.5167x TypeScript. Earlier observations are unconnected. Each equal-program geometric mean covers Evening and Lexer with three fresh processes per role. Base caches are primed; process startup is excluded. B2 is not installed.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
