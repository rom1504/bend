    <dc:title>Runtime Gaps</dc:title>
    <dc:date>2026-10-04</dc:date>
    <dc:description>All 15 maintained Phase36 execution points, sorted by candidate median execution time divided by the same-window TypeScript-emitted program median. A logarithmic axis has a visible 1x equal-time reference. Lower ratios are better; all recorded points remain slower than the reference. Original programs, focused diagnostics and boundary controls have distinct colors.</dc:description>
