  </g>
  <g id="text_26">
   <text style="fill: #586660; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="77.76" y="614.391159" transform="rotate(-0 77.76 614.391159)">Release and interface checks; the broad compiler suites were not rerun here.</text>
  </g>
  <g id="text_27">
   <text style="fill: #202d29; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="58.32" y="663.441891" transform="rotate(-0 58.32 663.441891)">04   JAVASCRIPT · retained P66 fixture census</text>
  </g>
  <g id="text_28">
   <text style="fill: #2b7f85; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="77.76" y="710.794181" transform="rotate(-0 77.76 710.794181)">1,045</text>
  </g>
  <g id="text_29">
   <text style="fill: #586660; font: 11.5px 'DejaVu Sans'" transform="translate(226.8 702.242203)">golden passes across the Node / Bun census</text>
   <text style="fill: #586660; font: 11.5px 'DejaVu Sans'" transform="translate(226.8 719.488789)">123 exemptions · 1 shared failure · 1 deferral</text>
  </g>
  <g id="text_30">
   <text style="fill: #586660; font: 10.5px 'DejaVu Sans'" transform="translate(58.32 768.300881)">Different suites answer different questions. Their counts are never added into one pass rate.</text>
   <text style="fill: #586660; font: 10.5px 'DejaVu Sans'" transform="translate(58.32 783.249928)">Checked laws and finite production contracts are reported separately; they do not prove the compiler.</text>
  </g>
