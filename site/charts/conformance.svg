  </g>
  <g id="text_20">
   <text style="fill: #586660; font: 11.5px 'DejaVu Sans'" transform="translate(77.76 435.323803)">45 catalog points (23 sources)  ·  70 backend obligations</text>
   <text style="fill: #586660; font: 11.5px 'DejaVu Sans'" transform="translate(77.76 452.570389)">31 fixture exclusions remain outside the supported native scope.</text>
  </g>
  <g id="text_21">
   <text style="fill: #202d29; font: 700 13.5px 'DejaVu Sans'; text-anchor: start" x="58.32" y="514.257891" transform="rotate(-0 58.32 514.257891)">03   PUBLIC CLI · P103 standalone release</text>
  </g>
  <g id="text_22">
   <text style="fill: #245f43; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="77.76" y="560.803781" transform="rotate(-0 77.76 560.803781)">41 / 41</text>
