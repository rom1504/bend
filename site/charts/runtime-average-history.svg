   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Runtime Average History</dc:title>
    <dc:date>2026-10-06</dc:date>
    <dc:description>Average compiled program execution time divided by TypeScript reference time at recorded release commits. Geometric means give each benchmark case equal weight. Lower is better and the 1x TypeScript reference is visible. Logarithmic axis from 0.8x to 25x. Breaks mark P41’s warmup change and P52’s direct JavaScript contract.
Each point uses its campaign’s TypeScript reference; P56 was remeasured in P58. Latest recorded average is 1.0461x at Phase58.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
