    <dc:title>Runtime Average History</dc:title>
    <dc:date>2026-10-04</dc:date>
    <dc:description>Average compiled program execution time divided by TypeScript reference time at recorded release commits. Geometric means give each benchmark case equal weight. Lower is better and the 1x TypeScript reference is visible. Same 45 cases. Warmup changed at P41; lines are separated at that boundary. Latest recorded average is 3.0787x at Phase45.</dc:description>
