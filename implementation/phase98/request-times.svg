<text x="20" y="169">B2 baseline (n=2 median)</text><rect x="280" y="151" width="470.22" height="26" fill="#5278a5"/><text x="760.22" y="169">150.471</text>
<text x="20" y="213">B2 candidate (n=2 median)</text><rect x="280" y="195" width="440.59" height="26" fill="#218475"/><text x="730.59" y="213">140.988</text>
<text x="20" y="257">TS/Bun (n=2 median; contextual)</text><rect x="280" y="239" width="141.75" height="26" fill="#5278a5"/><text x="431.75" y="257">45.359</text>
