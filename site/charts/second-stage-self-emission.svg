    <dc:title>Second Stage Self Emission</dc:title>
    <dc:date>2026-10-06</dc:date>
    <dc:description>Clean complete compiler-image emission falls from 223.475242000 seconds on P56 B2 to 36.058487328 seconds on P58 last01 B2, a 6.1976x speedup. Two observations under the same clean method; the baseline is retained from earlier in the P58 campaign and was not rerun consecutively with the selected image. Each image compiles its own source and verifies its own complete output bytes. Fresh type checking and 39.199-second qualification reproduction are separate clocks.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
