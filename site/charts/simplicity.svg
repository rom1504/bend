 <title>Simplicity</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Simplicity</dc:title>
    <dc:date>2026-10-06</dc:date>
    <dc:description>Physical, historical nonblank and later nonblank/noncomment source lines across 23 snapshots, on a zero-based axis. Dedicated consolidation removes 1842 physical lines from Phase5 to Phase7. Later coverage and performance work increases source size to 26560 physical lines. Nonblank and code-line series are distinct and missing counts are left unplotted. Source size is a proxy, not a complete measure of simplicity.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
