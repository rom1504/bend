    <dc:title>Second Stage Programs</dc:title>
    <dc:date>2026-10-06</dc:date>
    <dc:description>Latest P58 B2 first-request latency including import and API loading for Evening and Lexer, shown against each campaign's TypeScript reference. Evening: 2.4155x, Bend 2008.850 ms, TypeScript 831.657 ms; Lexer: 2.6222x, Bend 1499.595 ms, TypeScript 571.887 ms. Three fresh processes per role and program; Base caches primed, process startup excluded. Separately qualified B2 · not installed.</dc:description>
