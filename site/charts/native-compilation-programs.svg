 <title>Native Compilation Programs</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Native Compilation Programs</dc:title>
    <dc:date>2026-10-17</dc:date>
    <dc:description>All six Phase102 native B1 compilation sources compared with the matching Phase98 stage. Each labelled circle shows compiler-request time ratio, and each blue diamond shows the complete-process ratio including startup, Base preparation, output writing and teardown. Both clocks exclude Clang. Four alternating rounds per comparator. The 1x line means equal time to Phase98. Lower is better.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
