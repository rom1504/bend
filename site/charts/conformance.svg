    <dc:title>Conformance</dc:title>
    <dc:date>2026-10-17</dc:date>
    <dc:description>Four independent conformance scopes: Phase91 exact frontend agreement 3173 of 3174; Phase102 native B1 and B2 each pass 69 eligible fixtures and 3 expected rejections, with 31 excluded fixtures; Phase103 CLI passes 41 integration controls and 6 complete C/verdict pairs; retained JavaScript census has 1045 golden passes. These are separately denominated evidence, not a combined all-language pass rate. B2's deep frontend diagnostic remains shortened.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
