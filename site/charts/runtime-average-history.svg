  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Runtime Average History</dc:title>
    <dc:date>2026-10-08</dc:date>
    <dc:description>Average compiled program execution time divided by TypeScript reference time at recorded release commits. Geometric means give each benchmark case equal weight. Lower is better and the 1x TypeScript reference is visible. Logarithmic axis from 0.8x to 25x. Breaks mark changes to warmup, JavaScript contract, or TypeScript reference.
P65 is remeasured in P66 against the new TS pin; the final pair shares that reference. Latest recorded average is 1.0493x at Phase66.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
