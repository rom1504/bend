   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Runtime Gains</dc:title>
    <dc:date>2026-10-06</dc:date>
    <dc:description>Seven selected original-program runtime gains against same-window predecessor compiler baselines. Every row names its baseline-to-candidate phase transition, including Phase32 to Phase35. Generated JavaScript executes fixed inputs. Bars begin at 1x on a logarithmic speedup axis. Before and after milliseconds per complete exported call are printed for every row. These examples are not a suite average.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Bend Progress chart renderer</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
